# One host serves the SPA, the API and the websocket (same origin = Sanctum cookies work without CORS).
# Replace ops.example.com and the paths. Get the certificate with: certbot --nginx -d ops.example.com
server {
    listen 80;
    server_name ops.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name ops.example.com;
    ssl_certificate     /etc/letsencrypt/live/ops.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ops.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 55m;                      # keep >= the largest allowed upload (ops.files.max_kb) plus overhead

    # ---- security headers for the static SPA (the API sets its own, see SecurityHeaders middleware) ----
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # Tiptap/Mantine inject inline styles, hence 'unsafe-inline' for style-src only. Scripts are same-origin only.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' wss://ops.example.com; worker-src 'self'; manifest-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    root /var/www/company-ops-web/dist;
    index index.html;

    # Hashed build assets: cache for a year. index.html and the service worker must never be cached.
    location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }
    location = /index.html { add_header Cache-Control "no-store"; }
    location = /sw.js { add_header Cache-Control "no-store"; }
    location = /manifest.webmanifest { add_header Cache-Control "no-cache"; }

    # ---- API (Laravel public/index.php through PHP-FPM) ----
    location ~ ^/(api|sanctum|broadcasting)/ {
        root /var/www/company-ops-api/public;
        try_files $uri /index.php?$query_string;
    }
    location = /index.php {
        root /var/www/company-ops-api/public;
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_read_timeout 60s;
    }

    # ---- Reverb websocket (live chat and notifications) ----
    location /app {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
    }

    # ---- SPA fallback ----
    location / { try_files $uri /index.html; }

    # Never serve dotfiles, source maps or anything under storage directly.
    location ~ /\.(?!well-known) { deny all; }
}
