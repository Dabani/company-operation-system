; /etc/supervisor/conf.d/ops.conf - then: supervisorctl reread && supervisorctl update
[program:ops-queue]
command=php /var/www/company-ops-api/artisan queue:work --sleep=3 --tries=3 --backoff=30 --max-time=3600
user=www-data
numprocs=2
process_name=%(program_name)s_%(process_num)02d
autostart=true
autorestart=true
stopasgroup=true
stdout_logfile=/var/log/ops/queue.log
stderr_logfile=/var/log/ops/queue.err
stopwaitsecs=3600

[program:ops-reverb]
command=php /var/www/company-ops-api/artisan reverb:start --host=127.0.0.1 --port=8080
user=www-data
autostart=true
autorestart=true
stdout_logfile=/var/log/ops/reverb.log
stderr_logfile=/var/log/ops/reverb.err
